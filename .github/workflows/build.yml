name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          SA_PASSWORD: TestPassword123!
          ACCEPT_EULA: Y
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P TestPassword123! -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 1433:1433

    steps:
    - uses: actions/checkout@v7

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      run: bun install

    - name: Build
      run: bun run build

    - name: Lint
      run: bun run lint

    - name: Test connection
      env:
        SQLSERVER_SERVER: localhost
        SQLSERVER_PORT: 1433
        SQLSERVER_DATABASE: master
        SQLSERVER_USERNAME: sa
        SQLSERVER_PASSWORD: TestPassword123!
        SQLSERVER_ENCRYPT: 'false'
        SQLSERVER_TRUST_SERVER_CERTIFICATE: 'true'
      run: bun scripts/test-connection.ts

  docker:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build Docker image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: false
        tags: mssql-mcp:latest
